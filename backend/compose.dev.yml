services:
  api:
    build:
      context: .
      target: development
    command: npm run start:dev
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend_node_modules:
  redis_data:
